<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LILI CAVE</title>
<style>
html,body{margin:0;height:100%;background:#0a0a18;display:flex;align-items:center;justify-content:center;flex-direction:column}
canvas{image-rendering:pixelated;width:448px;height:448px;border:4px solid #ff77a8;border-radius:8px;box-shadow:0 0 50px #ff77a855;cursor:pointer}
p{color:#83769c;font:12px monospace;margin-top:10px}
</style>
</head>
<body>
<canvas id=c width=128 height=128></canvas>
<p>LILI CAVE — 1 file · 16 colors · 0 assets · klik/space buat terbang</p>
<script>
/* ============================================================
   LILI CAVE — pico-style demake by Lili
   Rules of "super kecil":
   1. 128x128 internal res (pico-8 style), CSS upscale 3.5x
   2. 16-color fixed palette (no gradients, no images)
   3. 3x5 bitmap font packed in ONE hex string (15 bits/glyph)
   4. Audio = WebAudio oscillators (no sound files)
   5. All state in a few globals, one rAF loop, no engine
   ============================================================ */
const X=document.getElementById('c').getContext('2d');
const P=['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8',
         '#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa'];

// --- font: every glyph = 3x5 bits packed into 4 hex chars ---
const F="A:2bed B:6bae C:3923 D:6b6e E:79a7 F:79a4 G:396b H:5bed I:7497 J:126a K:5bad L:4927 M:5fed N:5ffd O:2b6a P:7be4 Q:2b79 R:7bad S:388e T:7492 U:5b6f V:5b6a W:5bfd X:5aad Y:5a92 Z:72a7 0:7b6f 1:2c97 2:72a7 3:728f 4:5bc9 5:79cf 6:39ef 7:7249 8:7bef 9:7bcb  :0000 !:2482 -:01c0 .:0002 ::0410 ?:7282 <:1511 >:4454 +:05d0 /:12a4 *:55d5 ,:0014 ':1200 (:1521 ):444c %:52a5 _:0007";
const G={};F.split(' ').forEach(s=>{const i=s.indexOf(':');G[s.slice(0,i)]=parseInt(s.slice(i+1),16)});
function txt(s,x,y,col){
  s=String(s).toUpperCase();
  for(const ch of s){
    const b=G[ch]||0;
    X.fillStyle=P[col];
    for(let r=0;r<5;r++)for(let c=0;c<3;c++)
      if(b>>(14-(r*3+c))&1)X.fillRect(x+c,y+r,1,1);
    x+=4;
  }
  return x;
}
function txtC(s,y,col){txt(s,Math.round((128-String(s).length*4)/2),y,col)}

// --- audio: 3 beeps, zero files ---
let ac;
function beep(f,d,ty){
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),v=ac.createGain();
    o.type=ty||'square';o.frequency.value=f;v.gain.value=.07;
    o.connect(v);v.connect(ac.destination);o.start();
    v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.stop(ac.currentTime+d);
  }catch(e){}
}

// --- game state ---
const PW=34,GAP=38,SPD=.7;
let S=0,py=64,pv=0,pts=[],sc=0,bs=0,t=0,dead=0,auto=0;
try{bs=+(localStorage.lilicave||0)}catch(e){}
if(location.search.includes('auto'))auto=1;

function reset(){py=64;pv=0;pts=[[96,20+Math.random()*50]];sc=0;dead=0;t=0}
function flap(){pv=-2.15;beep(640,.06)}

function play(){
  pv+=.14;py+=pv;
  if(pts[0][0]<-6)pts.shift();
  if(pts[pts.length-1][0]<96)pts.push([pts[pts.length-1][0]+56,14+Math.random()*60]);
  for(const p of pts){
    p[0]-=SPD;
    if(!p[2]&&p[0]+5<PW){p[2]=1;sc++;beep(920,.07)}
    if(PW+3>p[0]&&PW<p[0]+5&&(py+1<p[1]||py+3>p[1]+GAP))dead=1;
  }
  if(py>115||py<-4)dead=1;
  if(auto){ // demo mode: aim at next gap
    const nx=pts.find(q=>q[0]+5>PW)||pts[0];
    if(nx&&py+2>nx[1]+GAP/2+2)flap();
  }
  if(dead){
    S=2;
    if(sc>bs){bs=sc;try{localStorage.lilicave=bs}catch(e){}}
    beep(180,.35,'sawtooth');
  }
}

// --- player sprite: 5x4 heart, 2 colors ---
const HR=[".###.","#####",".###.","..#.."];
function heart(x,y){
  X.fillStyle=P[14];
  for(let r=0;r<4;r++)for(let c=0;c<5;c++)
    if(HR[r][c]==='#')X.fillRect(x+c,y+r,1,1);
  X.fillStyle=P[7];X.fillRect(x+1,y+1,1,1);
}

function frame(){
  t++;
  // sky
  X.fillStyle=P[1];X.fillRect(0,0,128,128);
  // parallax stars (deterministic from index)
  X.fillStyle=P[13];
  for(let i=0;i<24;i++){
    let sx=Math.floor((i*53-t*.25)%128);if(sx<0)sx+=128;
    X.fillRect(sx,(i*37)%116,1,1);
  }
  // ground strip
  X.fillStyle=P[2];X.fillRect(0,120,128,8);
  X.fillStyle=P[14];
  for(let i=0;i<20;i++){
    let gx=Math.floor((i*9-t*SPD)%128);if(gx<0)gx+=128;
    X.fillRect(gx,120,3,1);
  }

  if(S===1){play()}
  if(S===2&&auto&&t%50===0){S=1;reset();flap()}

  // pipes
  for(const p of pts){
    if(S===0)continue;
    X.fillStyle=P[10];
    X.fillRect(p[0],0,5,p[1]);
    X.fillRect(p[0],p[1]+GAP,5,128-p[1]-GAP);
    X.fillStyle=P[7];
    X.fillRect(p[0]-1,p[1]-3,7,3);
    X.fillRect(p[0]-1,p[1]+GAP,7,3);
  }

  if(S===0){
    // title
    txtC('LILI CAVE',30,14);
    heart(61,58+Math.round(Math.sin(t*.08)*3));
    if(t%60<40)txtC('CLICK OR SPACE',82,7);
    txtC('BEST '+bs,94,13);
    txtC('< BY LILI >',110,2);
  }else{
    heart(PW,py);
    // score
    txtC(sc,4,7);
    if(S===2){
      X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,128,128);
      txtC('GAME OVER',38,8);
      txtC('SCORE '+sc,52,7);
      txtC('BEST '+bs,60,10);
      if(t%60<40)txtC('CLICK TO RETRY',74,14);
    }
  }
  requestAnimationFrame(frame);
}

// --- input ---
function inp(){
  if(!ac){beep(1,.01)} // unlock audio on first gesture
  if(S===0){S=1;reset();flap()}
  else if(S===1&&!auto)flap();
  else if(S===2){S=1;reset();flap()}
}
c.addEventListener('pointerdown',inp);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();inp()}});
if(auto){S=1;reset()}
// --- rec mode: synchronous capture into DOM for GIF previews (?rec=N) ---
if(location.search.includes('rec')){
  const rf=frame,rn=+(new URLSearchParams(location.search).get('rec'))||90;
  const d=document.createElement('textarea');d.id='REC';document.body.appendChild(d);
  const cap=[],st=[];
  for(let i=0;i<rn;i++){rf();cap.push(c.toDataURL('image/png'));st.push([S,Math.round(py),sc].join(','))}
  d.textContent=cap.join('\n');
  const d2=document.createElement('textarea');d2.id='REC2';d2.textContent=st.join(';');document.body.appendChild(d2);
}else{frame()}
</script>
</body>
</html>
