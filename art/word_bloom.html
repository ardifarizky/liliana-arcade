function words(options) {

  function word() {
    if (options && options.maxLength > 1) {
      return generateWordWithMaxLength();
    } else {
      return generateRandomWord();
    }
  }

  function generateWordWithMaxLength() {
    var rightSize = false;
    var wordUsed;
    while (!rightSize) {  
      wordUsed = generateRandomWord();
      if(wordUsed.length <= options.maxLength) {
        rightSize = true;
      }

    }
    return wordUsed;
  }

  function generateRandomWord() {
    return wordList[randInt(wordList.length)];
  }

  function randInt(lessThan) {
    return Math.floor(Math.random() * lessThan);
  }

  // No arguments = generate one word
  if (typeof(options) === 'undefined') {
    return word();
  }

  // Just a number = return that many words
  if (typeof(options) === 'number') {
    options = { exactly: options };
  }

  // options supported: exactly, min, max, join
  if (options.exactly) {
    options.min = options.exactly;
    options.max = options.exactly;
  }
  
  // not a number = one word par string
  if (typeof(options.wordsPerString) !== 'number') {
    options.wordsPerString = 1;
  }

  //not a function = returns the raw word
  if (typeof(options.formatter) !== 'function') {
    options.formatter = (word) => word;
  }

  //not a string = separator is a space
  if (typeof(options.separator) !== 'string') {
    options.separator = ' ';
  }

  var total = options.min + randInt(options.max + 1 - options.min);
  var results = [];
  var token = '';
  var relativeIndex = 0;

  for (var i = 0; (i < total * options.wordsPerString); i++) {
    if (relativeIndex === options.wordsPerString - 1) {
      token += options.formatter(word(), relativeIndex);
    }
    else {
      token += options.formatter(word(), relativeIndex) + options.separator;
    }
    relativeIndex++;
    if ((i + 1) % options.wordsPerString === 0) {
      results.push(token);
      token = ''; 
      relativeIndex = 0;
    }
   
  }
  if (typeof options.join === 'string') {
    results = results.join(options.join);
  }

  return results;
}

module.exports = words;
// Export the word list as it is often useful
words.wordList = wordList;

<script>
(function(){
// Seed = kata sungguhan (random-words) -> seedrandom -> poisson-disk-sampling
// -> voronoi (rhill) -> flow-field strokes per sel (simplex-noise), di-clip
// polygon per sel. Palet Lili: lavender/magenta/emas di atas malam.
const W = 640, H = 460;

function hexToRgb(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}

window.boot = function boot(){
  const seedWord = randomWords({exactly: 2, maxLength: 7}).join('-');
  const rng = new Math.seedrandom(seedWord);
  const rand = (a=0, b=1) => a + rng() * (b - a);
  const simplex = new SimplexNoise(() => rng());

  const canvas = document.getElementById('cv');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // background: radial night + speckle
  const g = ctx.createRadialGradient(W*0.5, H*0.45, 30, W*0.5, H*0.45, Math.max(W,H)*0.8);
  g.addColorStop(0, '#171126'); g.addColorStop(1, '#08060f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) {
    const x = rand(0,W), y = rand(0,H);
    const n = simplex.noise2D(x*0.02, y*0.02);
    ctx.fillStyle = n > 0.55 ? 'rgba(150,130,220,0.05)' : 'rgba(90,70,150,0.025)';
    ctx.fillRect(x, y, 1, 1);
  }

  // poisson disk points -> voronoi cells
  const pds = new PoissonDiskSampling({shape:[W,H], minDistance:34, maxDistance:64, tries:24}, () => rng());
  const pts = pds.fill();
  const voronoi = new Voronoi();
  const diagram = voronoi.compute(pts.map(p=>({x:p[0],y:p[1]})), {xl:-1,xr:W+1,yt:-1,yb:H+1});

  function pointInPoly(x, y, poly){
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
      if ((yi > y) !== (yj > y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside = !inside;
    }
    return inside;
  }

  function cellBBox(poly){
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for (const v of poly){x0=Math.min(x0,v.x);y0=Math.min(y0,v.y);x1=Math.max(x1,v.x);y1=Math.max(y1,v.y);}
    return [x0,y0,x1,y1];
  }

  function fieldAngle(x, y){
    const q = simplex.noise2D(x*0.0022, y*0.0022);
    const r = simplex.noise2D(x*0.0022 + q*1.8, y*0.0022 + q*1.8);
    return r * Math.PI * 2.2;
  }

  ctx.lineCap = 'round';
  let strokes = 0;

  for (const cell of diagram.cells) {
    const poly = cell.halfedges.map(he => he.getEndpoint()).filter(Boolean);
    if (poly.length < 3) continue;
    const [x0,y0,x1,y1] = cellBBox(poly);
    const cx = cell.site.x, cy = cell.site.y;

    // hue per sel dari noise: lavender / magenta / emas
    const hn = simplex.noise2D(cx*0.004, cy*0.004);
    let hue;
    if (hn < -0.15) hue = rand(38, 52);        // emas (jarang, aksen)
    else if (hn < 0.35) hue = rand(255, 285);  // lavender
    else hue = rand(296, 326);                 // magenta
    const sat = hue < 100 ? rand(60, 85) : rand(45, 85);
    const bri = hue < 100 ? rand(88, 100) : rand(72, 100);

    // flow-field strokes confined to this cell
    const nStrokes = Math.max(6, Math.round(((x1-x0)*(y1-y0)) / 180));
    for (let s = 0; s < nStrokes; s++) {
      let x = rand(x0, x1), y = rand(y0, y1);
      if (!pointInPoly(x, y, poly)) continue;
      const a0 = rand(4, 14)/100, lw = rand(0.5, 1.4);
      let px = x, py = y, steps = Math.round(rand(18, 60)), ok = true;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let k = 0; k < steps; k++) {
        const ang = fieldAngle(x, y);
        x += Math.cos(ang) * 1.6; y += Math.sin(ang) * 1.6;
        if (!pointInPoly(x, y, poly)) { ok = false; break; }
        ctx.lineTo(x, y); px = x; py = y;
      }
      ctx.strokeStyle = `hsla(${hue},${sat}%,${bri*0.62}%,${a0})`;
      ctx.lineWidth = lw; ctx.stroke();
      strokes++;
      // benang cerah tipis di atas (highlight)
      if (rng() < 0.18) {
        ctx.strokeStyle = `hsla(${hue},${sat}%,${bri}%,${a0*0.7})`;
        ctx.lineWidth = lw*0.5; ctx.stroke();
      }
    }
    // inti sel: titik cahaya kecil
    ctx.fillStyle = `hsla(${hue},${sat}%,${bri}%,0.5)`;
    ctx.beginPath(); ctx.arc(cx, cy, rand(0.8, 1.8), 0, Math.PI*2); ctx.fill();
  }

  window.__lastSeed = seedWord;
  document.getElementById('cap').textContent =
    'word bloom — seed: "' + seedWord + '" · poisson + voronoi + simplex flow field · ' +
    pts.length + ' seeds, ' + strokes + ' strokes';
};

boot();
document.getElementById('cv').addEventListener('click', boot);
})();
</script>
</body>
